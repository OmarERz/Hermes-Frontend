<div
  class="profile-menu"
  [class.sidebar-profile-menu]="ubicacion === 'arriba'"
  [class.opens-up]="ubicacion === 'arriba'"
>
  <button
    #trigger
    class="profile-trigger"
    type="button"
    (click)="alternarMenu()"
    (keydown)="abrirConTeclado($event)"
    [attr.aria-expanded]="menuAbierto"
    aria-haspopup="true"
    [attr.aria-controls]="menuId"
  >
    <span class="avatar" aria-hidden="true">{{ usuario.initials }}</span>
    <span class="profile-copy"
      ><strong>{{ usuario.name }}</strong
      ><small>{{ usuario.role }}</small></span
    ><span class="visually-hidden">Menú del perfil</span>
    <svg lucideChevronDown class="profile-chevron" aria-hidden="true"></svg>
  </button>
  @if (menuAbierto) {
    <section
      #panel
      class="profile-dropdown"
      [id]="menuId"
      role="group"
      aria-label="Menú del perfil"
      tabindex="-1"
      (keydown)="manejarTecladoPanel($event)"
    >
      <div class="profile-dropdown-identity">
        <span class="avatar" aria-hidden="true">{{ usuario.initials }}</span>
        <span
          ><strong>{{ usuario.name }}</strong
          ><small>{{ usuario.role }}</small></span
        >
      </div>
      <div class="profile-divider" role="separator"></div>
      <button class="theme-toggle" type="button" (click)="tema.toggle()">
        @if (tema.theme() === 'dark') {
          <svg lucideSun aria-hidden="true"></svg><span>Cambiar a tema claro</span>
        } @else {
          <svg lucideMoon aria-hidden="true"></svg><span>Cambiar a tema oscuro</span>
        }
      </button>
      <button
        class="logout-button"
        type="button"
        [disabled]="cerrandoSesion() || sesion.status() === 'initializing'"
        (click)="cerrarSesion()"
        [attr.aria-busy]="cerrandoSesion()"
      >
        <svg lucideLogOut aria-hidden="true"></svg><span>Cerrar sesión</span>
      </button>
      @if (cerrandoSesion()) {
        <p class="auth-unavailable" role="status">Cerrando sesión…</p>
      }
      @if (errorCierre()) {
        <p class="auth-unavailable" role="alert">{{ errorCierre() }}</p>
      }
    </section>
  }
</div>
