<aside class="sidebar" aria-label="Barra lateral">
  <a class="brand" routerLink="/inicio" aria-label="Hermes Control, inicio">
    <img class="brand-mark" src="/assets/hermes-winged-boot.png" alt="" aria-hidden="true" />
    <span>Hermes Control</span>
  </a>

  <nav class="main-nav" aria-label="Navegación principal">
    @for (section of navigation.sections(); track section.id) {
      <a
        [routerLink]="section.link"
        [class.active]="section.id === navigation.current()?.id"
        [attr.aria-current]="section.id === navigation.current()?.id ? 'true' : null"
        [attr.aria-label]="section.label"
      >
        <svg [lucideIcon]="section.icon" [size]="20" class="nav-icon" aria-hidden="true"></svg>
        <span>{{ section.label }}</span>
      </a>
    }
  </nav>

  <app-menu-perfil class="sidebar-profile" ubicacion="arriba" menuId="sidebar-profile-dropdown" />
</aside>
