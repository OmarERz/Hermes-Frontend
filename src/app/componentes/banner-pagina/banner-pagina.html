<header class="page-heading">
  <svg [lucideIcon]="icono" class="heading-icon" aria-hidden="true"></svg>
  <div class="heading-copy">
    <h1>{{ titulo }}</h1>
    <p #description [id]="descriptionId" [class.folded]="!expanded()">{{ descripcion }}</p>
    @if (clipped() || expanded()) {
      <button
        class="description-toggle"
        type="button"
        [attr.aria-expanded]="expanded()"
        [attr.aria-controls]="descriptionId"
        (click)="toggle()"
      >
        {{ expanded() ? 'Ver menos' : 'Ver más' }}
      </button>
    }
  </div>
</header>
<app-section-tabs />
