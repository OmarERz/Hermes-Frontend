# Security headers of every static answer (included per location: add_header is not inherited by a location that
# sets its own). Same set as the backend API (src/api/security_headers.py) plus the front's CSP.
add_header Content-Security-Policy $hermes_csp always;
add_header Strict-Transport-Security $hermes_hsts always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Cross-origin isolation without breaking the cross-origin requests the app makes (Firebase Auth uses CORS):
# credentialless sends no-cors subresource requests without credentials instead of requiring CORP on them.
add_header Cross-Origin-Embedder-Policy "credentialless" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
