name: CI

# Pull requests into develop or main only; pushes do not run it (Actions minutes are limited).
on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Lifecycle scripts of dependencies are not run; the build only needs the esbuild binary package.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint, format check, unit tests with the coverage thresholds and build
        run: npm run verify

  # In parallel with verify: Semgrep in its pinned image (scripts/semgrep.sh), about half a minute.
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep (registry packs and the project rules in .semgrep/)
        run: bash scripts/semgrep.sh
